services:
  - type: web
    name: x-case-study-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SLACK_SOCKET_MODE
        value: "false"
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: DRIVE_ROOT_FOLDER_ID
        value: 15I3CdBcBvQ9kUO_b7-mpausV3VzgWjQO
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: DRIVE_CACHE_TTL_MIN
        value: "10"
